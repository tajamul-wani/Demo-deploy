# Installed to: /etc/nginx/sites-available/myapp
# Enable with:  sudo ln -s /etc/nginx/sites-available/myapp /etc/nginx/sites-enabled/
# Then:         sudo nginx -t && sudo systemctl reload nginx
#
# The `default` site must be removed from sites-enabled — it also listens on
# port 80 with no server_name and can win the match, which is the usual cause
# of "why am I still seeing the nginx welcome page".

server {
    listen 80;
    server_name _;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # nginx is the only client the app ever sees, so without these every
        # request would appear to come from 127.0.0.1.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
